services:
  sms-inbox:
    build: .
    image: telnyx-sms-inbox:1.0
    container_name: telnyx-sms-inbox
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Values in .env win. These are safe defaults if a variable is missing.
      - POLL_INTERVAL=${POLL_INTERVAL:-15}
      - MESSAGE_LIMIT=${MESSAGE_LIMIT:-3}
      - TIMEZONE=${TIMEZONE:-UTC}
