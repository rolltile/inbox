<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Inbox — Telnyx</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>SMS Inbox</h1>
    <p class="subtitle">Telnyx · read-only</p>
  </div>
  <div class="header-meta">
    <span id="status-pill" class="pill pill-unknown">Checking…</span>
    <span class="meta"><span class="label">Number</span> <strong id="phone-number">—</strong></span>
    <span class="meta"><span class="label">Last updated</span> <strong id="last-updated">—</strong></span>
    <button id="refresh-btn" type="button">Refresh</button>
    <a class="logout" href="/logout">Log out</a>
  </div>
</header>

<main>
  <div id="error-banner" class="error hidden" role="alert"></div>
  <p class="auto-note">Auto-refreshes every <span id="poll-interval">15</span> seconds. Only the 3 most recent inbound messages are shown.</p>

  <div id="empty-state" class="empty hidden">
    <h2>No messages yet</h2>
    <p>No inbound SMS messages were found for this number. New messages will appear here automatically.</p>
  </div>

  <div id="messages" class="messages" aria-live="polite"></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
